# gitflow — учебный проект, пользователь vibecoding (rootless Docker)
services:
  vibecoding-gitflow:
    image: ${IMAGE}
    container_name: vibecoding-gitflow
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/gitflow"]
    # мост к Caddy: IP шлюза его сети + разрешение в ufw
    ports:
      - "172.28.0.1:8091:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
